  # ── State fair ──────────────────────────────────────────────────────────
  # NOTE: Doswell sits roughly 90 minutes south of Northern Virginia and falls
  # OUTSIDE the pipeline's service-area bounding box (config: lat 38.3–39.6).
  # It will therefore publish with is_mappable = false and
  # geo_within_service_region = false, and will be listed in
  # data/manual_review/suspicious_geocodes.json under --strict-region. That is
  # expected: it is carried deliberately as a day-trip destination, not a local
  # outing. iOS clients that filter on is_mappable will not show a pin for it.
  - slug: state-fair-of-virginia-2026
    title: "State Fair of Virginia"
    organizer: "State Fair of Virginia"
    source_url: "https://www.statefairva.org/"
    venue: "The Meadow Event Park"
    address: "13191 Dawn Boulevard, Doswell, VA 23047"
    city: "Doswell"
    county: "Hanover"
    summary: >-
      Virginia's state fair returns to The Meadow Event Park for ten days of
      carnival rides, livestock and agricultural competitions, craft and home
      arts exhibits, live entertainment, and fair food. Gates open daily at
      10 a.m.; closing time runs later on Friday and Saturday nights.
    price_text: "Ticketed"
    tags: [fair, festival, carnival, rides, animals, all_ages, outdoor]
    run:
      start_date: 2026-09-25
      end_date: 2026-10-04
      start_time: "10:00"
      end_time: "21:00"
    verified_on: 2026-08-07

