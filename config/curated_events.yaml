# NoVA Kids — curated marquee events
# =============================================================================
# Human-verified annual and seasonal family outings that no scrapeable calendar
# carries: county and state fairs, touring circuses, farm fall festivals,
# holiday light trails.
#
# This file is the ONLY place in the pipeline where event facts are entered by
# hand. That makes accuracy a maintenance duty, not an automated guarantee.
#
# RULES (see docs/source_rules.md § Curated Marquee Events)
#   1. source_url MUST be the event's own official page — never an aggregator,
#      a ticket reseller, a news article, or a listing site. Those may be used
#      to FIND an event; they may not be cited as its source.
#   2. Every field must be transcribed from the official page. Do not infer
#      hours, pricing, or age ranges. Leave a field out rather than guess.
#   3. Set verified_on to the date a human last read the official page. Entries
#      older than 180 days log a staleness warning on every pipeline run.
#   4. Past occurrences and anything beyond a 120-day horizon are dropped
#      automatically by scrapers/curated_events.py — an out-of-date entry
#      goes quiet on its own rather than publishing wrong dates.
#   5. Delete entries once their run is over and will not repeat.
#
# SCHEDULE — set exactly one of `run:` or `dates:`
#
#   run:                          # a continuous run with one set of hours
#     start_date: 2026-09-19
#     end_date: 2026-11-08
#     days_of_week: [thu, fri, sat, sun, mon]   # optional; default = every day
#     start_time: "10:00"         # optional; omit for an all-day entry
#     end_time: "18:00"           # optional
#
#   dates:                        # explicit per-day hours (fairs need this)
#     - date: 2026-08-15
#       start_time: "10:00"
#       end_time: "22:30"
#       note: "Sensory-friendly hours 10 a.m.–1 p.m."   # appended to summary
#
# Set `enabled: false` on an entry to keep it on file without publishing it.
# =============================================================================

events:

